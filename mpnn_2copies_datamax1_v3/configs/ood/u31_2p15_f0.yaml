# OOD split: 2P15 fold 0, u31 architecture.
# Config A + augment_self_cg on OOD data.
# 900 epochs with cosine_T_max=1195 (matches 1200-ep LR schedule).

lineage:
  parent: u31_config_A_global_sh_augment_self_cg
  changes: {data: "cleansplit -> ood_2p15_f0", epochs: "1200 -> 900"}
  description: "OOD 2P15 fold 0, Config A + augment_self_cg"

model:
  irreps_hidden: "384x0e"
  num_layers: 5
  scalars: 192
  lmax: 0
  num_atom_types: 10
  num_scalar_features: 25
  input_atom_embed_dim: 16
  r_max: 5.0
  num_basis: 14
  use_precomputed_edges: false
  radial_hidden: 64
  radial_layers: 2
  tp_mode: "diagonal"
  self_cg: "none"
  use_norm: true
  node_conditioned_radial: true
  cross_object_embed_dim: 16
  aggr: "sum"
  pool_mode: "sum"
  head_hidden: 128
  onsite_mode: "delta,mlp"
  onsite_dim: 64
  pool_streams: ["ligand", "pocket"]
  edge_onsite_mode: "delta,mlp"
  edge_onsite_dim: 64
  edge_hidden_dim: 128
  persistent_edge_state: true
  edge_state_dim: 64
  edge_feedback: true
  global_sh_pooling: true
  global_sh_lmax: 2
  global_sh_channels: 16
  global_sh_out_dim: 64
  global_sh_separate_proj: true
  global_sh_head: "augment_self_cg"

train:
  epochs: 900
  cosine_T_max: 1195
  batch_size: 64
  learning_rate: 0.0002
  weight_decay: 0.0001
  min_lr: 0.00001
  warmup_epochs: 5
  patience: 0

data:
  train_path: "gign_exact_v1/data/v3_with_residues/ood/ood_2p15_f0_train_5A.pt"
  val_path: "gign_exact_v1/data/v3_with_residues/ood/ood_2p15_f0_val_5A.pt"
  test_path: "gign_exact_v1/data/v3_with_residues/casf2016_5A.pt"
  test2_path: "gign_exact_v1/data/v3_with_residues/ood/ood_2p15_test_5A.pt"
  use_presplit: true
  use_inter_edges: true
  use_2copies: true

output:
  dir: "mpnn_2copies_datamax1_v3/experiments/ood"
