lineage:
  parent: zc26_vanilla_1copy_lmax1
  changes:
    num_layers: "5 -> 2"
  description: Vanilla 1-copy MPNN, lmax=1 par-matched, 2 layers. No onsite, no SH, no persistent edges, no feedback.
model:
  irreps_hidden: "224x0e + 224x1o"
  num_layers: 2
  scalars: 192
  lmax: 1
  num_atom_types: 10
  num_scalar_features: 25
  input_atom_embed_dim: 16
  r_max: 5.0
  num_basis: 14
  use_precomputed_edges: false
  radial_hidden: 64
  radial_layers: 2
  tp_mode: diagonal
  self_cg: none
  use_norm: true
  node_conditioned_radial: true
  cross_object_embed_dim: 16
  aggr: sum
  pool_mode: sum
  head_hidden: 128
  onsite_mode: none
  pool_streams:
  - ligand
  - pocket
  edge_onsite_mode: none
  edge_hidden_dim: 128
  persistent_edge_state: false
  edge_state_dim: 64
  edge_feedback: false
  global_sh_pooling: false
  residue_global_sh_pooling: false
train:
  epochs: 1200
  batch_size: 64
  learning_rate: 0.0002
  weight_decay: 0.0001
  min_lr: 1.0e-05
  warmup_epochs: 5
  patience: 0
data:
  train_path: gign_exact_v1/data/v3_with_residues/cleansplit_f0_train_5A.pt
  val_path: gign_exact_v1/data/v3_with_residues/cleansplit_f0_val_5A.pt
  test_path: gign_exact_v1/data/v3_with_residues/cleansplit_casf2016_5A.pt
  use_presplit: true
  use_inter_edges: true
  use_2copies: false
output:
  dir: mpnn_2copies_datamax1_v3/experiments/cleansplit/ZC_series_ablation
