lineage:
  parent: zc18_2copy_pool_both
  changes:
    lmax: "0 -> 1"
    irreps_hidden: "384x0e -> 224x0e + 224x1o (uniform-uvu, param-matched)"
  description: zc18 backbone (persistent edges + edge feedback, no paired readouts) at MP lmax=1. Apples-to-apples no-readouts row for Table 3 lmax_paired_vs_vanilla.
model:
  irreps_hidden: "224x0e + 224x1o"
  num_layers: 5
  scalars: 192
  lmax: 1
  num_atom_types: 10
  num_scalar_features: 25
  input_atom_embed_dim: 16
  r_max: 5.0
  num_basis: 14
  use_precomputed_edges: false
  radial_hidden: 64
  radial_layers: 2
  tp_mode: diagonal
  self_cg: none
  use_norm: true
  node_conditioned_radial: true
  cross_object_embed_dim: 16
  aggr: sum
  pool_mode: sum
  head_hidden: 128
  onsite_mode: none
  pool_streams:
  - ligand
  - pocket
  pool_unbound: true
  edge_onsite_mode: none
  edge_hidden_dim: 128
  persistent_edge_state: true
  edge_state_dim: 64
  edge_feedback: true
  global_sh_pooling: false
  residue_global_sh_pooling: false
train:
  epochs: 1200
  batch_size: 64
  learning_rate: 0.0002
  weight_decay: 0.0001
  min_lr: 1.0e-05
  warmup_epochs: 5
  patience: 0
data:
  train_path: gign_exact_v1/data/v3_with_residues/cleansplit_f0_train_5A.pt
  val_path: gign_exact_v1/data/v3_with_residues/cleansplit_f0_val_5A.pt
  test_path: gign_exact_v1/data/v3_with_residues/cleansplit_casf2016_5A.pt
  use_presplit: true
  use_inter_edges: true
  use_2copies: true
output:
  dir: mpnn_2copies_datamax1_v3/experiments/cleansplit/ZC_series_ablation
