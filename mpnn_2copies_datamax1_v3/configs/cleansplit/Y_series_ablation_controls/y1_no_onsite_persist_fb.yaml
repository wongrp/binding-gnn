# Y1: Persistent edges + feedback, but NO onsite comparison.
# Tests: do edge mechanisms help without comparing bound vs unbound?
# Expect: if y1 ≈ w7, the edge plumbing only helps through the onsite comparison.

lineage:
  parent: d2_persist_feedback
  changes: {onsite_mode: "reembed_cg -> none", edge_onsite_mode: "delta,mlp -> none"}
  description: "Persist + feedback without onsite — isolates edge plumbing from state comparison"

model:
  irreps_hidden: "384x0e"
  num_layers: 5
  scalars: 192
  lmax: 0
  num_atom_types: 10
  num_scalar_features: 25
  input_atom_embed_dim: 16
  r_max: 5.0
  num_basis: 14
  use_precomputed_edges: false
  radial_hidden: 64
  radial_layers: 2
  tp_mode: "diagonal"
  self_cg: "none"
  use_norm: true
  node_conditioned_radial: true
  cross_object_embed_dim: 16
  aggr: "sum"
  pool_mode: "sum"
  head_hidden: 128
  onsite_mode: "none"
  pool_streams: ["ligand", "pocket"]
  pool_unbound: true
  persistent_edge_state: true
  edge_state_dim: 64
  edge_hidden_dim: 128
  edge_feedback: true

train:
  epochs: 1200
  batch_size: 64
  learning_rate: 0.0002
  weight_decay: 0.0001
  min_lr: 0.00001
  warmup_epochs: 5
  patience: 0

data:
  train_path: "gign_exact_v1/data/v3_with_residues/cleansplit_f0_train_5A.pt"
  val_path: "gign_exact_v1/data/v3_with_residues/cleansplit_f0_val_5A.pt"
  test_path: "gign_exact_v1/data/v3_with_residues/cleansplit_casf2016_5A.pt"
  use_presplit: true
  use_inter_edges: true
  use_2copies: true

output:
  dir: "mpnn_2copies_datamax1_v3/experiments/cleansplit/Y_series_ablation_controls"
