# H5: Purest edge-only — raw edge_readout, no edge_onsite, no node pool.
# Head sees only scatter_sum of 64-dim edge states. The minimal test.
# Control: h4 (edge_onsite + edge_readout).

lineage:
  parent: D_series/d2_persist_feedback
  changes: {node_readout: false, onsite_mode: "none", edge_onsite_mode: "none", edge_readout: true}
  description: "Purest edge-only: prediction from raw edge pool alone (head_in=64)."

model:
  irreps_hidden: "384x0e"
  num_layers: 5
  scalars: 192
  lmax: 0
  num_atom_types: 10
  num_scalar_features: 25
  input_atom_embed_dim: 16
  r_max: 5.0
  num_basis: 14
  use_precomputed_edges: false
  radial_hidden: 64
  radial_layers: 2
  tp_mode: "diagonal"
  self_cg: "none"
  use_norm: true
  node_conditioned_radial: true
  cross_object_embed_dim: 16
  aggr: "sum"
  pool_mode: "sum"
  node_readout: false
  head_hidden: 128
  onsite_mode: "none"
  pool_streams: ["ligand", "pocket"]
  edge_onsite_mode: "none"
  edge_hidden_dim: 128
  persistent_edge_state: true
  edge_state_dim: 64
  edge_feedback: true
  edge_readout: true

train:
  epochs: 1200
  batch_size: 64
  learning_rate: 0.0002
  weight_decay: 0.0001
  min_lr: 0.00001
  warmup_epochs: 5
  patience: 0

data:
  train_path: "gign_exact_v1/data/v3/cleansplit_f0_train_5A.pt"
  val_path: "gign_exact_v1/data/v3/cleansplit_f0_val_5A.pt"
  test_path: "gign_exact_v1/data/v3/cleansplit_casf2016_5A.pt"
  use_presplit: true
  use_inter_edges: true
  use_2copies: true

output:
  dir: "mpnn_2copies_datamax1_v3/experiments/cleansplit/H_series"
