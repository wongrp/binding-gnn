# H7: Edge-only, shallow + narrow (256x0e, 3L). ~593K params.
# Tests: Do edges need deep MP or is 3L enough?
# Control: h6 (256x0e 5L, 836K), h4 (384x0e 5L, 1.45M).

lineage:
  parent: D_series/d5_shallow_edge
  changes: {node_readout: false, onsite_mode: "none", edge_readout: true, irreps_hidden: "384x0e -> 256x0e"}
  description: "Edge-only, shallow 3L + narrow 256x0e. ~593K params."

model:
  irreps_hidden: "256x0e"
  num_layers: 3
  scalars: 128
  lmax: 0
  num_atom_types: 10
  num_scalar_features: 25
  input_atom_embed_dim: 16
  r_max: 5.0
  num_basis: 14
  use_precomputed_edges: false
  radial_hidden: 64
  radial_layers: 2
  tp_mode: "diagonal"
  self_cg: "none"
  use_norm: true
  node_conditioned_radial: true
  cross_object_embed_dim: 16
  aggr: "sum"
  pool_mode: "sum"
  node_readout: false
  head_hidden: 128
  onsite_mode: "none"
  pool_streams: ["ligand", "pocket"]
  edge_onsite_mode: "delta,mlp"
  edge_onsite_dim: 64
  edge_hidden_dim: 128
  persistent_edge_state: true
  edge_state_dim: 64
  edge_feedback: true
  edge_readout: true

train:
  epochs: 1200
  batch_size: 64
  learning_rate: 0.0002
  weight_decay: 0.0001
  min_lr: 0.00001
  warmup_epochs: 5
  patience: 0

data:
  train_path: "gign_exact_v1/data/v3/cleansplit_f0_train_5A.pt"
  val_path: "gign_exact_v1/data/v3/cleansplit_f0_val_5A.pt"
  test_path: "gign_exact_v1/data/v3/cleansplit_casf2016_5A.pt"
  use_presplit: true
  use_inter_edges: true
  use_2copies: true

output:
  dir: "mpnn_2copies_datamax1_v3/experiments/cleansplit/H_series"
