# S6: Attention + Iterative (Directions 5+3)
# Base: d2 (persist+feedback, reembed_cg, lmax=1, uuu)
# Tests: Combined attention-weighted re-embedding with 2 iterative rounds.

lineage:
  parent: d2_persist_feedback
  changes: {reembed_attention: "false -> true", reembed_iterations: "1 -> 2"}
  description: "Attention + iterative re-embedding"

model:
  irreps_hidden: "384x0e"
  num_layers: 5
  scalars: 192
  lmax: 0
  num_atom_types: 10
  num_scalar_features: 25
  input_atom_embed_dim: 16
  r_max: 5.0
  num_basis: 14
  use_precomputed_edges: false
  radial_hidden: 64
  radial_layers: 2
  tp_mode: "diagonal"
  self_cg: "none"
  use_norm: true
  node_conditioned_radial: true
  cross_object_embed_dim: 16
  aggr: "sum"
  pool_mode: "sum"
  head_hidden: 128
  onsite_mode: "reembed_cg"
  onsite_dim: 64
  onsite_reembed_lmax: 1
  onsite_cg_mode: "uuu"
  pool_streams: ["ligand", "pocket"]
  edge_onsite_mode: "delta,mlp"
  edge_onsite_dim: 64
  edge_hidden_dim: 128
  persistent_edge_state: true
  edge_state_dim: 64
  edge_feedback: true
  reembed_attention: true
  reembed_iterations: 2

train:
  epochs: 1200
  batch_size: 64
  learning_rate: 0.0002
  weight_decay: 0.0001
  min_lr: 0.00001
  warmup_epochs: 5
  patience: 0

data:
  train_path: "gign_exact_v1/data/v3/cleansplit_f0_train_5A.pt"
  val_path: "gign_exact_v1/data/v3/cleansplit_f0_val_5A.pt"
  test_path: "gign_exact_v1/data/v3/cleansplit_casf2016_5A.pt"
  use_presplit: true
  use_inter_edges: true
  use_2copies: true

output:
  dir: "mpnn_2copies_datamax1_v3/experiments/cleansplit/S_series_reembed_advances"
