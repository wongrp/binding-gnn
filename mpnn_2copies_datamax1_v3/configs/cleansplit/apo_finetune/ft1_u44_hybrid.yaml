# FT1: Finetune u44 (dual-scale SH) on hybrid holo+apo data.
# Train on apo-only subset with pos_unbound = apo positions.
# Test on hybrid CASF (209 apo + 76 holo fallback).
#
# Usage:
#   conda run -n nn_dta_copy python mpnn_2copies_datamax1_v3/train.py \
#     --config mpnn_2copies_datamax1_v3/configs/cleansplit/apo_finetune/ft1_u44_hybrid.yaml \
#     --finetune mpnn_2copies_datamax1_v3/experiments/cleansplit/U_series_angular_resolution/u44_dual_scale_sh/2026-03-03_1_s42/best_model_val.pt

model:
  irreps_hidden: "384x0e"
  num_layers: 5
  scalars: 192
  lmax: 0
  num_atom_types: 10
  num_scalar_features: 25
  input_atom_embed_dim: 16
  r_max: 5.0
  num_basis: 14
  use_precomputed_edges: false
  radial_hidden: 64
  radial_layers: 2
  tp_mode: "diagonal"
  self_cg: "none"
  use_norm: true
  node_conditioned_radial: true
  cross_object_embed_dim: 16
  aggr: "sum"
  pool_mode: "sum"
  head_hidden: 128
  onsite_mode: "reembed_cg"
  onsite_dim: 64
  onsite_reembed_lmax: 1
  onsite_cg_mode: "uuu"
  pool_streams: ["ligand", "pocket"]
  edge_onsite_mode: "delta,mlp"
  edge_onsite_dim: 64
  edge_hidden_dim: 128
  persistent_edge_state: true
  edge_state_dim: 64
  edge_feedback: true
  global_sh_pooling: true
  global_sh_lmax: 2
  global_sh_channels: 16
  global_sh_out_dim: 64
  global_sh_separate_proj: true
  residue_global_sh_pooling: true
  residue_global_sh_lmax: 2
  residue_global_sh_channels: 16
  residue_global_sh_out_dim: 64
  residue_global_sh_separate_proj: true

train:
  epochs: 100
  batch_size: 64
  learning_rate: 0.00005
  weight_decay: 0.0001
  min_lr: 0.000005
  warmup_epochs: 3
  patience: 30

data:
  train_path: "gign_exact_v1/data/v3_with_residues/cleansplit_f0_train_hybrid_5A.pt"
  val_path: "gign_exact_v1/data/v3_with_residues/cleansplit_f0_val_5A.pt"
  test_path: "gign_exact_v1/data/v3_with_residues/cleansplit_casf2016_hybrid_5A.pt"
  test2_path: "gign_exact_v1/data/v3_with_residues/cleansplit_casf2016_5A.pt"
  use_presplit: true
  use_inter_edges: true
  use_2copies: true

output:
  dir: "mpnn_2copies_datamax1_v3/experiments/cleansplit/apo_finetune"
