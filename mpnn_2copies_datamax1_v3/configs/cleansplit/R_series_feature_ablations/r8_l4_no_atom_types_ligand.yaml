# CleanSplit R8: L4 (persist+fb+virtual K=8 d=32) + no_atom_types on ligand.
# L4 is #1 val-sel (1.303). Virtual attention regularizes (best LP generalizer).
# Ligand atom type removal further reduces scaffold memorization.
# Tests whether mechanism regularization + feature ablation are additive.

lineage:
  parent: "cleansplit/L_series/l4_baseline"
  changes: {feature_mask: "none -> no_atom_types", feature_mask_target: "both -> ligand"}
  description: "L4 + ligand no_atom_types. Mechanism + feature regularization."

model:
  irreps_hidden: "384x0e"
  num_layers: 5
  scalars: 192
  lmax: 0
  num_atom_types: 10
  num_scalar_features: 25
  input_atom_embed_dim: 16
  r_max: 5.0
  num_basis: 14
  use_precomputed_edges: false
  radial_hidden: 64
  radial_layers: 2
  tp_mode: "diagonal"
  self_cg: "none"
  use_norm: true
  node_conditioned_radial: true
  cross_object_embed_dim: 16
  aggr: "sum"
  pool_mode: "sum"
  head_hidden: 128
  onsite_mode: "reembed_cg"
  onsite_dim: 64
  onsite_reembed_lmax: 1
  onsite_cg_mode: "uuu"
  pool_streams: ["ligand", "pocket"]
  edge_onsite_mode: "delta,mlp"
  edge_onsite_dim: 64
  edge_hidden_dim: 128
  persistent_edge_state: true
  edge_state_dim: 64
  edge_feedback: true
  virtual_onsite_mode: "attention"
  num_virtual_nodes: 8
  virtual_node_dim: 32
  virtual_pool_streams: ["all"]
  feature_mask: "no_atom_types"
  feature_mask_target: "ligand"

train:
  epochs: 1200
  batch_size: 64
  learning_rate: 0.0002
  weight_decay: 0.0001
  min_lr: 0.00001
  warmup_epochs: 5
  patience: 0

data:
  train_path: "gign_exact_v1/data/v3/cleansplit_f0_train_5A.pt"
  val_path: "gign_exact_v1/data/v3/cleansplit_f0_val_5A.pt"
  test_path: "gign_exact_v1/data/v3/cleansplit_casf2016_5A.pt"
  use_presplit: true
  use_inter_edges: true
  use_2copies: true

output:
  dir: "mpnn_2copies_datamax1_v3/experiments/cleansplit/R_series_feature_ablations"
