# Clean split A2: CG uuu onsite. gign_v3 A-series winner — verify on leak-free split.
# vs A1: onsite_mode mlp -> cg, onsite_cg_mode uuu
model:
  irreps_hidden: "384x0e"
  num_layers: 5
  scalars: 192
  lmax: 0
  num_atom_types: 10
  num_scalar_features: 25
  r_max: 5.0
  num_basis: 14
  use_precomputed_edges: false
  radial_hidden: 64
  radial_layers: 2
  tp_mode: "diagonal"
  self_cg: "none"
  use_norm: true
  node_conditioned_radial: true
  cross_object_embed_dim: 16
  aggr: "sum"
  pool_mode: "sum"
  head_hidden: 128
  onsite_mode: "cg"
  onsite_dim: 64
  onsite_cg_mode: "uuu"
  pool_streams: ["ligand", "pocket"]

train:
  epochs: 1200
  batch_size: 64
  learning_rate: 0.0002
  weight_decay: 0.000001
  min_lr: 0.0002
  warmup_epochs: 5
  patience: 0

data:
  train_path: "gign_exact_v1/data/v3/cleansplit_f0_train_5A.pt"
  val_path: "gign_exact_v1/data/v3/cleansplit_f0_val_5A.pt"
  test_path: "gign_exact_v1/data/v3/cleansplit_casf2016_5A.pt"
  use_presplit: true
  use_inter_edges: true
  use_2copies: true

output:
  dir: "mpnn_2copies_datamax1_v3/experiments/cleansplit/A_series"
