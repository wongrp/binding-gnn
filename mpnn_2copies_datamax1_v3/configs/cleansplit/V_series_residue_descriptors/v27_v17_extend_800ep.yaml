# V27: v17 (residue + node delta,mlp) extended to 800 epochs.
# Tests: Does longer training improve v17 (VG 1.302 at 600ep)?

lineage:
  parent: v17_residue_plus_node_onsite
  changes: {epochs: "600 -> 800", cosine_T_max: "default -> 795"}
  description: "v17 extended training — residue + scalar node on-site, longer schedule."

model:
  irreps_hidden: "384x0e"
  num_layers: 5
  scalars: 192
  lmax: 0
  num_atom_types: 10
  num_scalar_features: 25
  input_atom_embed_dim: 16
  r_max: 5.0
  num_basis: 14
  use_precomputed_edges: false
  radial_hidden: 64
  radial_layers: 2
  tp_mode: "diagonal"
  self_cg: "none"
  use_norm: true
  node_conditioned_radial: true
  cross_object_embed_dim: 16
  aggr: "sum"
  pool_mode: "sum"
  head_hidden: 128
  pool_streams: ["ligand", "pocket"]
  onsite_mode: "delta,mlp"
  onsite_dim: 64
  residue_onsite_mode: "concat_mlp"
  residue_onsite_dim: 128
  residue_agg: "mean"

train:
  epochs: 800
  batch_size: 64
  learning_rate: 0.0002
  weight_decay: 0.0001
  min_lr: 0.00005
  cosine_T_max: 795
  warmup_epochs: 5
  patience: 0

data:
  train_path: "gign_exact_v1/data/v3_with_residues/cleansplit_f0_train_5A.pt"
  val_path: "gign_exact_v1/data/v3_with_residues/cleansplit_f0_val_5A.pt"
  test_path: "gign_exact_v1/data/v3_with_residues/cleansplit_casf2016_5A.pt"
  use_presplit: true
  use_inter_edges: true
  use_2copies: true

output:
  dir: "mpnn_2copies_datamax1_v3/experiments/cleansplit/V_series_residue_descriptors"
