# V32: v8 tmax1195 (residue concat_mlp 128, min_lr=1e-5) extended to 800ep, min_lr=5e-6.
# Tests: Does v8 tmax1195 benefit from even lower min_lr + longer training?

lineage:
  parent: v8_concat_mlp_mean_128_tmax1195
  changes: {epochs: "600 -> 800", min_lr: "1e-5 -> 5e-6", cosine_T_max: "1195 -> 795"}
  description: "v8 tmax1195 extended + lower min_lr — deepest annealing on residue-only."

model:
  irreps_hidden: "384x0e"
  num_layers: 5
  scalars: 192
  lmax: 0
  num_atom_types: 10
  num_scalar_features: 25
  input_atom_embed_dim: 16
  r_max: 5.0
  num_basis: 14
  use_precomputed_edges: false
  radial_hidden: 64
  radial_layers: 2
  tp_mode: "diagonal"
  self_cg: "none"
  use_norm: true
  node_conditioned_radial: true
  cross_object_embed_dim: 16
  aggr: "sum"
  pool_mode: "sum"
  head_hidden: 128
  pool_streams: ["ligand", "pocket"]
  onsite_mode: "none"
  residue_onsite_mode: "concat_mlp"
  residue_onsite_dim: 128
  residue_agg: "mean"

train:
  epochs: 800
  batch_size: 64
  learning_rate: 0.0002
  weight_decay: 0.0001
  min_lr: 0.000005
  cosine_T_max: 795
  warmup_epochs: 5
  patience: 0

data:
  train_path: "gign_exact_v1/data/v3_with_residues/cleansplit_f0_train_5A.pt"
  val_path: "gign_exact_v1/data/v3_with_residues/cleansplit_f0_val_5A.pt"
  test_path: "gign_exact_v1/data/v3_with_residues/cleansplit_casf2016_5A.pt"
  use_presplit: true
  use_inter_edges: true
  use_2copies: true

output:
  dir: "mpnn_2copies_datamax1_v3/experiments/cleansplit/V_series_residue_descriptors"
