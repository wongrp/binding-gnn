# V44: v17 (residue + node delta,mlp) with sum aggregation.
# Tests: Sum on node+residue dual base — does sum help with atom-level comparison?
# Compare: v44 vs v17 (sum vs mean on dual base), v44 vs v41 (+ node on-site)

lineage:
  parent: v17_residue_plus_node_onsite
  changes: {residue_agg: "mean -> sum"}
  description: "v17 (delta,mlp + residue) with sum agg — aggregation on dual base"

model:
  irreps_hidden: "384x0e"
  num_layers: 5
  scalars: 192
  lmax: 0
  num_atom_types: 10
  num_scalar_features: 25
  input_atom_embed_dim: 16
  r_max: 5.0
  num_basis: 14
  use_precomputed_edges: false
  radial_hidden: 64
  radial_layers: 2
  tp_mode: "diagonal"
  self_cg: "none"
  use_norm: true
  node_conditioned_radial: true
  cross_object_embed_dim: 16
  aggr: "sum"
  pool_mode: "sum"
  head_hidden: 128
  pool_streams: ["ligand", "pocket"]
  onsite_mode: "delta,mlp"
  onsite_dim: 64
  residue_onsite_mode: "concat_mlp"
  residue_onsite_dim: 128
  residue_agg: "sum"

train:
  epochs: 600
  batch_size: 64
  learning_rate: 0.0002
  weight_decay: 0.0001
  min_lr: 0.00005
  warmup_epochs: 5
  patience: 0

data:
  train_path: "gign_exact_v1/data/v3_with_residues/cleansplit_f0_train_5A.pt"
  val_path: "gign_exact_v1/data/v3_with_residues/cleansplit_f0_val_5A.pt"
  test_path: "gign_exact_v1/data/v3_with_residues/cleansplit_casf2016_5A.pt"
  use_presplit: true
  use_inter_edges: true
  use_2copies: true

output:
  dir: "mpnn_2copies_datamax1_v3/experiments/cleansplit/V_series_residue_descriptors"
