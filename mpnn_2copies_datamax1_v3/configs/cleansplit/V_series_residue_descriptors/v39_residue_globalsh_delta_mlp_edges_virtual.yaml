# V39: Residue + global SH + node delta,mlp + edges + virtual nodes.
# Tests: Full scalar stack + all three scales — maximum combination.
# Compare: v37 vs v39 (+ virtual), v39 vs v40 (delta,mlp vs reembed_cg)

lineage:
  parent: v37_residue_globalsh_delta_mlp_edges
  changes: {virtual_onsite_mode: "none -> attention", num_virtual_nodes: 8}
  description: "Full scalar stack + residue + global SH + virtual nodes"

model:
  irreps_hidden: "384x0e"
  num_layers: 5
  scalars: 192
  lmax: 0
  num_atom_types: 10
  num_scalar_features: 25
  input_atom_embed_dim: 16
  r_max: 5.0
  num_basis: 14
  use_precomputed_edges: false
  radial_hidden: 64
  radial_layers: 2
  tp_mode: "diagonal"
  self_cg: "none"
  use_norm: true
  node_conditioned_radial: true
  cross_object_embed_dim: 16
  aggr: "sum"
  pool_mode: "sum"
  head_hidden: 128
  pool_streams: ["ligand", "pocket"]
  onsite_mode: "delta,mlp"
  onsite_dim: 64
  edge_onsite_mode: "delta,mlp"
  edge_onsite_dim: 64
  edge_hidden_dim: 128
  persistent_edge_state: true
  edge_state_dim: 64
  edge_feedback: true
  virtual_onsite_mode: "attention"
  num_virtual_nodes: 8
  virtual_node_dim: 32
  virtual_pool_streams: ["all"]
  residue_onsite_mode: "concat_mlp"
  residue_onsite_dim: 128
  residue_agg: "mean"
  global_sh_pooling: true
  global_sh_lmax: 2
  global_sh_channels: 16
  global_sh_out_dim: 64
  global_sh_separate_proj: true

train:
  epochs: 600
  batch_size: 64
  learning_rate: 0.0002
  weight_decay: 0.0001
  min_lr: 0.00005
  warmup_epochs: 5
  patience: 0

data:
  train_path: "gign_exact_v1/data/v3_with_residues/cleansplit_f0_train_5A.pt"
  val_path: "gign_exact_v1/data/v3_with_residues/cleansplit_f0_val_5A.pt"
  test_path: "gign_exact_v1/data/v3_with_residues/cleansplit_casf2016_5A.pt"
  use_presplit: true
  use_inter_edges: true
  use_2copies: true

output:
  dir: "mpnn_2copies_datamax1_v3/experiments/cleansplit/V_series_residue_descriptors"
