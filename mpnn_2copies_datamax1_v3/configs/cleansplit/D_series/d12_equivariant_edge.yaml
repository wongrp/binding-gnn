# Cleansplit D12: D5 but with equivariant MP (128x0e+14x1o, lmax=1).
# Novel: equivariant MP + post-MP edge onsite. All prior equivariant tests (B-series)
# had no edge features. Tests whether l>0 improves node representations that feed edges.

lineage:
  parent: d5_shallow_edge
  changes: {irreps_hidden: "384x0e -> 128x0e+14x1o", lmax: "0 -> 1", scalars: "192 -> 128"}
  description: "Equivariant MP + post-MP edge onsite. Does l>0 improve edge features?"

model:
  irreps_hidden: "128x0e+14x1o"
  num_layers: 3
  scalars: 128
  lmax: 1
  num_atom_types: 10
  num_scalar_features: 25
  input_atom_embed_dim: 16
  r_max: 5.0
  num_basis: 14
  use_precomputed_edges: false
  radial_hidden: 64
  radial_layers: 2
  tp_mode: "diagonal"
  self_cg: "none"
  use_norm: true
  node_conditioned_radial: true
  cross_object_embed_dim: 16
  aggr: "sum"
  pool_mode: "sum"
  head_hidden: 128
  onsite_mode: "reembed_cg"
  onsite_dim: 64
  onsite_reembed_lmax: 1
  onsite_cg_mode: "uuu"
  pool_streams: ["ligand", "pocket"]
  edge_onsite_mode: "delta,mlp"
  edge_onsite_dim: 64
  edge_hidden_dim: 128

train:
  epochs: 1200
  batch_size: 64
  learning_rate: 0.0002
  weight_decay: 0.0001
  min_lr: 0.00001
  warmup_epochs: 5
  patience: 0

data:
  train_path: "gign_exact_v1/data/v3/cleansplit_f0_train_5A.pt"
  val_path: "gign_exact_v1/data/v3/cleansplit_f0_val_5A.pt"
  test_path: "gign_exact_v1/data/v3/cleansplit_casf2016_5A.pt"
  use_presplit: true
  use_inter_edges: true
  use_2copies: true

output:
  dir: "mpnn_2copies_datamax1_v3/experiments/cleansplit/D_series"
