# ZB7: Small backbone + big onsite/readout.
# Hypothesis: the binding signal is in the comparison, not the features.
# Keep MP cheap (2 layers, 96ch), invest in onsite + SH + head.

lineage:
  parent: zb1_mini
  changes: {onsite_dim: "64 -> 128", edge_onsite_dim: "64 -> 128", global_sh_channels: "16 -> 32", head_hidden: "128 -> 256", epochs: "400 -> 1200"}
  description: "Small backbone, big onsite: invest in comparison not features"

model:
  irreps_hidden: "192x0e"
  lmax: 0
  num_layers: 2
  scalars: 96
  num_atom_types: 10
  num_scalar_features: 25
  r_max: 5.0
  num_basis: 14
  use_precomputed_edges: false
  radial_hidden: 64
  radial_layers: 2
  tp_mode: "diagonal"
  self_cg: "none"
  use_norm: true
  node_conditioned_radial: true
  cross_object_embed_dim: 16
  aggr: "sum"
  pool_mode: "sum"
  head_hidden: 256
  onsite_mode: "reembed_cg"
  onsite_dim: 128
  pool_streams: ["ligand", "pocket"]
  edge_onsite_mode: "delta,mlp"
  edge_onsite_dim: 128
  edge_hidden_dim: 128
  persistent_edge_state: true
  edge_state_dim: 64
  edge_feedback: true
  global_sh_lmax: 2
  global_sh_channels: 32
  residue_global_sh_pooling: true
  residue_global_sh_lmax: 2
  residue_global_sh_channels: 32

train:
  epochs: 1200
  batch_size: 64
  learning_rate: 0.0002
  weight_decay: 0.0001
  min_lr: 0.00001
  warmup_epochs: 5
  patience: 0

data:
  train_path: "gign_exact_v1/data/v3_with_residues/cleansplit_f0_train_5A.pt"
  val_path: "gign_exact_v1/data/v3_with_residues/cleansplit_f0_val_5A.pt"
  test_path: "gign_exact_v1/data/v3_with_residues/cleansplit_casf2016_5A.pt"
  use_presplit: true
  use_inter_edges: true
  use_2copies: true

output:
  dir: "mpnn_2copies_datamax1_v3/experiments/cleansplit/ZB_series_mini"
