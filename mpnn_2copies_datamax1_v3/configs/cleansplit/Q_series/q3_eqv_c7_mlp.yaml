# Q3: Equivariant MP + MLP on-site + edge on-site. Scaffold = c7.
# Paper Config C: equivariant MP, scalar on-site.
# Tests: does equivariant MP enrich scalars enough, or does on-site need l>0?

lineage:
  parent: c7_reembed_edge_delta_mlp_full
  changes: {irreps_hidden: "384x0e -> 128x0e + 14x1o", lmax: "0 -> 1", scalars: "192 -> 128", onsite_mode: "reembed_cg -> mlp"}
  description: "Equivariant MP + MLP scalar on-site version of c7 (Config C)."

model:
  irreps_hidden: "128x0e + 14x1o"
  num_layers: 5
  scalars: 128
  lmax: 1
  num_atom_types: 10
  num_scalar_features: 25
  input_atom_embed_dim: 16
  r_max: 5.0
  num_basis: 14
  use_precomputed_edges: false
  radial_hidden: 64
  radial_layers: 2
  tp_mode: "diagonal"
  self_cg: "none"
  use_norm: true
  node_conditioned_radial: true
  cross_object_embed_dim: 16
  aggr: "sum"
  pool_mode: "sum"
  head_hidden: 128
  onsite_mode: "mlp"
  onsite_dim: 64
  pool_streams: ["ligand", "pocket"]
  edge_onsite_mode: "delta,mlp"
  edge_onsite_dim: 64
  edge_hidden_dim: 128

train:
  epochs: 1200
  batch_size: 64
  learning_rate: 0.0002
  weight_decay: 0.0001
  min_lr: 0.00001
  warmup_epochs: 5
  patience: 0

data:
  train_path: "gign_exact_v1/data/v3/cleansplit_f0_train_5A.pt"
  val_path: "gign_exact_v1/data/v3/cleansplit_f0_val_5A.pt"
  test_path: "gign_exact_v1/data/v3/cleansplit_casf2016_5A.pt"
  use_presplit: true
  use_inter_edges: true
  use_2copies: true

output:
  dir: "mpnn_2copies_datamax1_v3/experiments/cleansplit/Q_series"
