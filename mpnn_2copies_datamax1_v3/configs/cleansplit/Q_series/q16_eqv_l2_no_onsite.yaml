# Q16: Equivariant MP L=2, no onsite. Missing cell in Table 2.
# Based on q1 (L=1 no onsite) with lmax=2 and matched-param irreps from q13.

lineage:
  parent: q1_eqv_no_onsite
  changes: {lmax: "1 -> 2", irreps_hidden: "128x0e + 14x1o -> 104x0e + 12x1o + 6x2e"}
  description: "L=2 no onsite — fills Table 2 cell"

model:
  irreps_hidden: "104x0e + 12x1o + 6x2e"
  lmax: 2
  num_layers: 5
  scalars: 104
  num_atom_types: 10
  num_scalar_features: 25
  r_max: 5.0
  num_basis: 14
  use_precomputed_edges: false
  radial_hidden: 64
  radial_layers: 2
  tp_mode: "diagonal"
  self_cg: "none"
  use_norm: true
  node_conditioned_radial: true
  cross_object_embed_dim: 16
  aggr: "sum"
  pool_mode: "sum"
  head_hidden: 128
  onsite_mode: "none"
  pool_streams: ["ligand", "pocket"]
  pool_unbound: true

train:
  epochs: 1200
  batch_size: 64
  learning_rate: 0.0002
  weight_decay: 0.0001
  min_lr: 0.00001
  warmup_epochs: 5
  patience: 0

data:
  train_path: "gign_exact_v1/data/v3_with_residues/cleansplit_f0_train_5A.pt"
  val_path: "gign_exact_v1/data/v3_with_residues/cleansplit_f0_val_5A.pt"
  test_path: "gign_exact_v1/data/v3_with_residues/cleansplit_casf2016_5A.pt"
  use_presplit: true
  use_inter_edges: true
  use_2copies: true

output:
  dir: "mpnn_2copies_datamax1_v3/experiments/cleansplit/Q_series"
