# Q1: Equivariant MP, no on-site. Scaffold = b2.
# Paper Config B (= Config C, degenerate since no on-site).
# Tests: does equivariant MP alone change apo coordinate sensitivity?

lineage:
  parent: b2_no_onsite
  changes: {irreps_hidden: "384x0e -> 128x0e + 14x1o", lmax: "0 -> 1", scalars: "192 -> 128"}
  description: "Equivariant MP version of b2 baseline (no on-site)."

model:
  irreps_hidden: "128x0e + 14x1o"
  num_layers: 5
  scalars: 128
  lmax: 1
  num_atom_types: 10
  num_scalar_features: 25
  r_max: 5.0
  num_basis: 14
  use_precomputed_edges: false
  radial_hidden: 64
  radial_layers: 2
  tp_mode: "diagonal"
  self_cg: "none"
  use_norm: true
  node_conditioned_radial: true
  cross_object_embed_dim: 16
  aggr: "sum"
  pool_mode: "sum"
  head_hidden: 128
  onsite_mode: "none"
  pool_streams: ["ligand", "pocket"]
  pool_unbound: true

train:
  epochs: 1200
  batch_size: 64
  learning_rate: 0.0002
  weight_decay: 0.0001
  min_lr: 0.00001
  warmup_epochs: 5
  patience: 0

data:
  train_path: "gign_exact_v1/data/v3/cleansplit_f0_train_5A.pt"
  val_path: "gign_exact_v1/data/v3/cleansplit_f0_val_5A.pt"
  test_path: "gign_exact_v1/data/v3/cleansplit_casf2016_5A.pt"
  use_presplit: true
  use_inter_edges: true
  use_2copies: true

output:
  dir: "mpnn_2copies_datamax1_v3/experiments/cleansplit/Q_series"
