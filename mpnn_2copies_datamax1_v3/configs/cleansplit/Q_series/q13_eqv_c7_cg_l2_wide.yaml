# Q13: Equivariant MP (lmax=2, param-matched) + CG on-site + edge on-site. Scaffold = c7.
# Paper Config B at lmax=2, widened to match q2 params (~1.53M).
# Isolates angular resolution from capacity: same param budget as lmax=1 (q2).

lineage:
  parent: q9_eqv_c7_cg_l2
  changes: {irreps_hidden: "64x0e + 8x1o + 4x2e -> 104x0e + 12x1o + 6x2e"}
  description: "Param-matched lmax=2 variant of q2 (~1.52M vs q2 ~1.53M)."

model:
  irreps_hidden: "104x0e + 12x1o + 6x2e"
  num_layers: 5
  scalars: 128
  lmax: 2
  num_atom_types: 10
  num_scalar_features: 25
  input_atom_embed_dim: 16
  r_max: 5.0
  num_basis: 14
  use_precomputed_edges: false
  radial_hidden: 64
  radial_layers: 2
  tp_mode: "diagonal"
  self_cg: "none"
  use_norm: true
  node_conditioned_radial: true
  cross_object_embed_dim: 16
  aggr: "sum"
  pool_mode: "sum"
  head_hidden: 128
  onsite_mode: "cg"
  onsite_dim: 64
  onsite_cg_mode: "uuu"
  pool_streams: ["ligand", "pocket"]
  edge_onsite_mode: "delta,mlp"
  edge_onsite_dim: 64
  edge_hidden_dim: 128

train:
  epochs: 1200
  batch_size: 64
  learning_rate: 0.0002
  weight_decay: 0.0001
  min_lr: 0.00001
  warmup_epochs: 5
  patience: 0

data:
  train_path: "gign_exact_v1/data/v3/cleansplit_f0_train_5A.pt"
  val_path: "gign_exact_v1/data/v3/cleansplit_f0_val_5A.pt"
  test_path: "gign_exact_v1/data/v3/cleansplit_casf2016_5A.pt"
  use_presplit: true
  use_inter_edges: true
  use_2copies: true

output:
  dir: "mpnn_2copies_datamax1_v3/experiments/cleansplit/Q_series"
