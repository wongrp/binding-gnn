# Q21: q8 - virtual nodes + dual-scale SH (atom + residue).
# Tests: the full u44 SH recipe but with equivariant MP.

lineage:
  parent: q8_eqv_l4_mlp
  changes: {virtual_onsite_mode: "attention -> none", global_sh_pooling: "false -> true", residue_global_sh_pooling: "false -> true"}
  description: "q8 without virtual, with dual SH — u44 recipe on equivariant backbone"

model:
  irreps_hidden: "128x0e + 14x1o"
  num_layers: 5
  scalars: 128
  lmax: 1
  num_atom_types: 10
  num_scalar_features: 25
  input_atom_embed_dim: 16
  r_max: 5.0
  num_basis: 14
  use_precomputed_edges: false
  radial_hidden: 64
  radial_layers: 2
  tp_mode: "diagonal"
  self_cg: "none"
  use_norm: true
  node_conditioned_radial: true
  cross_object_embed_dim: 16
  aggr: "sum"
  pool_mode: "sum"
  head_hidden: 128
  onsite_mode: "mlp"
  onsite_dim: 64
  pool_streams: ["ligand", "pocket"]
  edge_onsite_mode: "delta,mlp"
  edge_onsite_dim: 64
  edge_hidden_dim: 128
  persistent_edge_state: true
  edge_state_dim: 64
  edge_feedback: true
  global_sh_pooling: true
  global_sh_lmax: 2
  global_sh_channels: 16
  global_sh_out_dim: 64
  global_sh_separate_proj: true
  residue_global_sh_pooling: true
  residue_global_sh_lmax: 2
  residue_global_sh_channels: 16
  residue_global_sh_out_dim: 64
  residue_global_sh_separate_proj: true

train:
  epochs: 1200
  batch_size: 64
  learning_rate: 0.0002
  weight_decay: 0.0001
  min_lr: 0.00001
  warmup_epochs: 5
  patience: 0

data:
  train_path: "gign_exact_v1/data/v3_with_residues/cleansplit_f0_train_5A.pt"
  val_path: "gign_exact_v1/data/v3_with_residues/cleansplit_f0_val_5A.pt"
  test_path: "gign_exact_v1/data/v3_with_residues/cleansplit_casf2016_5A.pt"
  use_presplit: true
  use_inter_edges: true
  use_2copies: true

output:
  dir: "mpnn_2copies_datamax1_v3/experiments/cleansplit/Q_series"
