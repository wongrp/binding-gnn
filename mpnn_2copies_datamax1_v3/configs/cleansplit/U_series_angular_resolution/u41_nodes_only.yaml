# U41: Nodes only (no edges, no global SH).
# Factorial ablation: baseline node stream only (Config D without edges or SH).
#
# Baseline: u13 (VG 1.290) -- full N+E+G

lineage:
  parent: u13_d2_global_sh_separate_proj
  changes: {persistent_edge_state: "true -> false", edge_feedback: "true -> false", edge_onsite_mode: "delta,mlp -> none", global_sh_pooling: "true -> false"}
  description: "Nodes only (no edge stream, no global SH)"

model:
  irreps_hidden: "384x0e"
  num_layers: 5
  scalars: 192
  lmax: 0
  num_atom_types: 10
  num_scalar_features: 25
  input_atom_embed_dim: 16
  r_max: 5.0
  num_basis: 14
  use_precomputed_edges: false
  radial_hidden: 64
  radial_layers: 2
  tp_mode: "diagonal"
  self_cg: "none"
  use_norm: true
  node_conditioned_radial: true
  cross_object_embed_dim: 16
  aggr: "sum"
  pool_mode: "sum"
  head_hidden: 128
  onsite_mode: "reembed_cg"
  onsite_dim: 64
  onsite_reembed_lmax: 1
  onsite_cg_mode: "uuu"
  pool_streams: ["ligand", "pocket"]
  node_readout: true
  edge_onsite_mode: "none"
  persistent_edge_state: false
  edge_feedback: false
  global_sh_pooling: false

train:
  epochs: 1200
  batch_size: 64
  learning_rate: 0.0002
  weight_decay: 0.0001
  min_lr: 0.00001
  warmup_epochs: 5
  patience: 0

data:
  train_path: "gign_exact_v1/data/v3/cleansplit_f0_train_5A.pt"
  val_path: "gign_exact_v1/data/v3/cleansplit_f0_val_5A.pt"
  test_path: "gign_exact_v1/data/v3/cleansplit_casf2016_5A.pt"
  use_presplit: true
  use_inter_edges: true
  use_2copies: true

output:
  dir: "mpnn_2copies_datamax1_v3/experiments/cleansplit/U_series_angular_resolution"
