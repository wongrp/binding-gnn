# U27: d2 + global SH channels=32 + equivariant head (self_cg).
# RESCUE TEST: wider channels underperformed with the power spectrum
# (u18: VG 1.318 vs u14: 1.293). With self_cg, the FCTP learns which
# cross-channel pairs matter — more channels could synergize with
# learned contraction rather than inflating the fixed C^2 dot product.
#
# Baseline: u13 (VG 1.290) with channels=16

lineage:
  parent: u13_d2_global_sh_separate_proj
  changes: {global_sh_channels: "16 -> 32", global_sh_head: "none -> self_cg"}
  description: "d2 + channels=32 + self_cg head — wider channels with learned contraction"

model:
  irreps_hidden: "384x0e"
  num_layers: 5
  scalars: 192
  lmax: 0
  num_atom_types: 10
  num_scalar_features: 25
  input_atom_embed_dim: 16
  r_max: 5.0
  num_basis: 14
  use_precomputed_edges: false
  radial_hidden: 64
  radial_layers: 2
  tp_mode: "diagonal"
  self_cg: "none"
  use_norm: true
  node_conditioned_radial: true
  cross_object_embed_dim: 16
  aggr: "sum"
  pool_mode: "sum"
  head_hidden: 128
  onsite_mode: "reembed_cg"
  onsite_dim: 64
  onsite_reembed_lmax: 1
  onsite_cg_mode: "uuu"
  pool_streams: ["ligand", "pocket"]
  edge_onsite_mode: "delta,mlp"
  edge_onsite_dim: 64
  edge_hidden_dim: 128
  persistent_edge_state: true
  edge_state_dim: 64
  edge_feedback: true
  global_sh_pooling: true
  global_sh_lmax: 2
  global_sh_channels: 32
  global_sh_out_dim: 64
  global_sh_separate_proj: true
  global_sh_head: "self_cg"

train:
  epochs: 1200
  batch_size: 64
  learning_rate: 0.0002
  weight_decay: 0.0001
  min_lr: 0.00001
  warmup_epochs: 5
  patience: 0

data:
  train_path: "gign_exact_v1/data/v3/cleansplit_f0_train_5A.pt"
  val_path: "gign_exact_v1/data/v3/cleansplit_f0_val_5A.pt"
  test_path: "gign_exact_v1/data/v3/cleansplit_casf2016_5A.pt"
  use_presplit: true
  use_inter_edges: true
  use_2copies: true

output:
  dir: "mpnn_2copies_datamax1_v3/experiments/cleansplit/U_series_angular_resolution"
