# ZB 1L 256ch 5-fold CV — fold 2
lineage:
  parent: zb_1L_256ch_lr1e4
  changes: {cv: "fold 2 of 5"}
  description: "1L 256ch 5-fold CV, fold 2"

model:
  irreps_hidden: "512x0e"
  lmax: 0
  num_layers: 1
  scalars: 256
  num_atom_types: 10
  num_scalar_features: 25
  r_max: 5.0
  num_basis: 14
  use_precomputed_edges: false
  radial_hidden: 64
  radial_layers: 2
  tp_mode: "diagonal"
  self_cg: "none"
  use_norm: true
  node_conditioned_radial: true
  cross_object_embed_dim: 16
  aggr: "sum"
  pool_mode: "sum"
  head_hidden: 128
  onsite_mode: "reembed_cg"
  onsite_dim: 64
  pool_streams: ["ligand", "pocket"]
  edge_onsite_mode: "delta,mlp"
  edge_onsite_dim: 64
  edge_hidden_dim: 128
  persistent_edge_state: true
  edge_state_dim: 64
  edge_feedback: true
  global_sh_lmax: 2
  global_sh_channels: 16
  residue_global_sh_pooling: true
  residue_global_sh_lmax: 2
  residue_global_sh_channels: 16

train:
  epochs: 800
  batch_size: 64
  learning_rate: 0.0001
  weight_decay: 0.0001
  min_lr: 0.000005
  warmup_epochs: 5
  patience: 0

data:
  train_path: "gign_exact_v1/data/v3_with_residues/cleansplit_f2_train_5A.pt"
  val_path: "gign_exact_v1/data/v3_with_residues/cleansplit_f2_val_5A.pt"
  test_path: "gign_exact_v1/data/v3_with_residues/cleansplit_casf2016_5A.pt"
  use_presplit: true
  use_inter_edges: true
  use_2copies: true

output:
  dir: "mpnn_2copies_datamax1_v3/experiments/cleansplit/ZB_1L256_5fold_cv"
