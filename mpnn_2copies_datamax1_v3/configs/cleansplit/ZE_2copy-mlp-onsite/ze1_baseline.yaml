# ZE1: 2-copy with MLP on-site (scalar comparison only).
# delta,mlp on-site compares bound and unbound scalars at each node.
lineage:
  parent: u44_dual_scale_sh
  changes:
    onsite_mode: "delta,mlp"
    edge_onsite_mode: none
    persistent_edge_state: false
    edge_feedback: false
    global_sh_pooling: false
    residue_global_sh_pooling: false
  description: 2-copy with MLP on-site only
model:
  irreps_hidden: 384x0e
  num_layers: 5
  scalars: 192
  lmax: 0
  num_atom_types: 10
  num_scalar_features: 25
  input_atom_embed_dim: 16
  r_max: 5.0
  num_basis: 14
  use_precomputed_edges: false
  radial_hidden: 64
  radial_layers: 2
  tp_mode: diagonal
  self_cg: none
  use_norm: true
  node_conditioned_radial: true
  cross_object_embed_dim: 16
  aggr: sum
  pool_mode: sum
  head_hidden: 128
  onsite_mode: "delta,mlp"
  onsite_dim: 64
  pool_streams:
  - ligand
  - pocket
train:
  epochs: 1200
  batch_size: 64
  learning_rate: 0.0002
  weight_decay: 0.0001
  min_lr: 1.0e-05
  warmup_epochs: 5
  patience: 0
data:
  train_path: gign_exact_v1/data/v3_with_residues/cleansplit_f0_train_5A.pt
  val_path: gign_exact_v1/data/v3_with_residues/cleansplit_f0_val_5A.pt
  test_path: gign_exact_v1/data/v3_with_residues/cleansplit_casf2016_5A.pt
  use_presplit: true
  use_inter_edges: true
  use_2copies: true
output:
  dir: mpnn_2copies_datamax1_v3/experiments/cleansplit/ZE_2copy-mlp-onsite
