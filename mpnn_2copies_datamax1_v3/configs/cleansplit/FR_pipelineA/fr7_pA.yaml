lineage:
  parent: fr7_zb160_res_all.yaml
  description: "Pipeline A counterpart of fr7_zb160_res_all (residues from PyMOL byres\
    \ 5\xC5, archived data)"
model:
  irreps_hidden: 320x0e
  num_layers: 2
  scalars: 160
  lmax: 0
  num_atom_types: 10
  num_scalar_features: 33
  input_atom_embed_dim: 16
  r_max: 5.0
  num_basis: 14
  use_precomputed_edges: false
  radial_hidden: 64
  radial_layers: 2
  tp_mode: diagonal
  self_cg: none
  use_norm: true
  node_conditioned_radial: true
  cross_object_embed_dim: 16
  aggr: sum
  pool_mode: sum
  head_hidden: 128
  onsite_mode: reembed_cg
  onsite_dim: 64
  onsite_reembed_lmax: 1
  onsite_cg_mode: uuu
  pool_streams:
  - ligand
  - pocket
  edge_onsite_mode: delta,mlp
  edge_onsite_dim: 64
  edge_hidden_dim: 128
  persistent_edge_state: true
  edge_state_dim: 64
  edge_feedback: true
  global_sh_pooling: true
  global_sh_lmax: 2
  global_sh_channels: 16
  global_sh_out_dim: 64
  global_sh_separate_proj: true
  residue_global_sh_pooling: true
  residue_global_sh_lmax: 2
  residue_global_sh_channels: 16
  residue_global_sh_out_dim: 64
  residue_global_sh_separate_proj: true
  aa_embed_dim: 8
train:
  epochs: 800
  batch_size: 64
  learning_rate: 0.0001
  weight_decay: 0.0001
  min_lr: 1.0e-05
  warmup_epochs: 5
  patience: 0
data:
  train_path: gign_exact_v1/data/v3_residue_pipelineA_archive/cleansplit_f0_train_5A.pipelineA.pt
  val_path: gign_exact_v1/data/v3_residue_pipelineA_archive/cleansplit_f0_val_5A.pipelineA.pt
  test_path: gign_exact_v1/data/v3_residue_pipelineA_archive/cleansplit_casf2016_5A.pipelineA.pt
  use_presplit: true
  use_inter_edges: true
  use_2copies: true
  use_ext_features: true
  use_bfactor: true
output:
  dir: mpnn_2copies_datamax1_v3/experiments/cleansplit/FR_pipelineA/fr7_pA
