# B5: Atom global-SH radial profile re-expressed as physically motivated multipole tail.
#
# Replaces the learned radial MLP R_l(r) with the closed-form multipole
#   R_l(r) = (r^2 + r_c^2)^(-(l+1)/2) * cos_cutoff(r/r_max)
# with a soft core at r_c = 0.5 A and the same r_max cutoff as the learned form.
# Zero new parameters; physically motivated as the leading multipole tail of the
# binding electrostatic.
#
# Decision rule: 5-seed mean RMSE on CleanSplit CASF-2016 <= 1.295 (paper headline).
# Pass = the learned R_l is a parameterisation of the multipole tail.
# Fail = residual learned content beyond r^{-(l+1)} matters.
#
# Baseline: u44_dual_scale_sh (1.293 +/- 0.015 over 5 seeds)

lineage:
  parent: u44_dual_scale_sh
  changes: {global_sh_radial_form: "learned -> multipole"}
  description: "Atom gsh: learned radial MLP -> r^{-(l+1)} * cos_cutoff (no new params)"

model:
  irreps_hidden: "384x0e"
  num_layers: 5
  scalars: 192
  lmax: 0
  num_atom_types: 10
  num_scalar_features: 25
  input_atom_embed_dim: 16
  r_max: 5.0
  num_basis: 14
  use_precomputed_edges: false
  radial_hidden: 64
  radial_layers: 2
  tp_mode: "diagonal"
  self_cg: "none"
  use_norm: true
  node_conditioned_radial: true
  cross_object_embed_dim: 16
  aggr: "sum"
  pool_mode: "sum"
  head_hidden: 128
  onsite_mode: "reembed_cg"
  onsite_dim: 64
  onsite_reembed_lmax: 1
  onsite_cg_mode: "uuu"
  pool_streams: ["ligand", "pocket"]
  edge_onsite_mode: "delta,mlp"
  edge_onsite_dim: 64
  edge_hidden_dim: 128
  persistent_edge_state: true
  edge_state_dim: 64
  edge_feedback: true
  global_sh_pooling: true
  global_sh_lmax: 2
  global_sh_channels: 16
  global_sh_out_dim: 64
  global_sh_separate_proj: true
  global_sh_radial_form: "multipole"   # the only change vs u44
  residue_global_sh_pooling: true
  residue_global_sh_lmax: 2
  residue_global_sh_channels: 16
  residue_global_sh_out_dim: 64
  residue_global_sh_separate_proj: true

train:
  epochs: 1200
  batch_size: 64
  learning_rate: 0.0002
  weight_decay: 0.0001
  min_lr: 0.00001
  warmup_epochs: 5
  patience: 0

data:
  train_path: "gign_exact_v1/data/v3_with_residues/cleansplit_f0_train_5A.pt"
  val_path: "gign_exact_v1/data/v3_with_residues/cleansplit_f0_val_5A.pt"
  test_path: "gign_exact_v1/data/v3_with_residues/cleansplit_casf2016_5A.pt"
  use_presplit: true
  use_inter_edges: true
  use_2copies: true

output:
  dir: "mpnn_2copies_datamax1_v3/experiments/cleansplit/B_reexpression"
